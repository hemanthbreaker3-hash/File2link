services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      DATABASE_NAME: ${DATABASE_NAME:-file2link}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PORT: ${PORT:-8000}
      SESSION_DIR: /app/sessions
    volumes:
      # Persist the authorized Telegram session across restarts/recreates so
      # the container reuses it instead of re-running bot auth every time it
      # comes up (repeated auth attempts are what trigger/escalate a
      # Telegram FloodWait - see app/streamer/manager.py).
      - telegram_sessions:/app/sessions
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-8000}/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
  telegram_sessions:
