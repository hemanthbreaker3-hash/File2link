{% extends "base.html" %}
{% block title %}Admin · Anizoneflix{% endblock %}
{% block content %}
<h1 style="margin-top:0">Dashboard</h1>
<div class="grid grid-3">
 <div class="card stat"><span class="muted">Users</span><b>{{ total_users }}</b></div>
 <div class="card stat"><span class="muted">Files</span><b>{{ total_files }}</b></div>
 <div class="card stat"><span class="muted">CPU</span><b>{{ cpu|round(1) }}%</b><div class="bar"><i style="width:{{ cpu }}%"></i></div></div>
</div>
<div class="row space"><a class="btn" href="/admin/users">Users</a><a class="btn" href="/admin/files">Files</a></div>
{% endblock %}
