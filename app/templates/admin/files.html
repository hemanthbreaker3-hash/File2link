{% extends "base.html" %}
{% block title %}Files · Anizoneflix{% endblock %}
{% block content %}
<div class="card meta"><div class="row" style="justify-content:space-between"><h1 style="margin:0">Files</h1>
<form class="row" method="get" action="/admin/files"><input name="q" value="{{ query or '' }}" placeholder="Search filename" style="width:min(320px,70vw)"><button class="btn btn-primary" type="submit">Search</button></form></div>
<div style="overflow:auto;margin-top:16px"><table><thead><tr><th>Filename</th><th>Size</th><th>Views</th><th>Action</th></tr></thead><tbody>
{% for file in files %}<tr><td>{{ file.filename }}</td><td>{{ (file.file_size/(1024*1024))|round(2) }} MB</td><td>{{ file.access_count }}</td><td><a href="/watch/{{ file.short_code }}">Open</a></td></tr>{% endfor %}
</tbody></table></div></div>
{% endblock %}
