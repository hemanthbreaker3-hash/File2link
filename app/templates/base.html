<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Anizoneflix">
  <title>{% block title %}Anizoneflix{% endblock %}</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0d12;--card:#12161f;--line:#242a36;--text:#f4f6f8;--muted:#9aa3b2;--accent:#7c5cff;--accent2:#6348df}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.5}
    a{color:inherit}.wrap{width:min(1040px,calc(100% - 28px));margin:auto}.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
    .brand{font-weight:800;font-size:1.15rem;text-decoration:none;letter-spacing:.02em}.brand-mark{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:8px;border-radius:8px;background:var(--accent);vertical-align:middle}
    main{padding:34px 0 60px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px}.muted{color:var(--muted)}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:#171c26;text-decoration:none;font-weight:700}
    .btn:hover{border-color:#3a4252;background:#1b2130}.btn-primary{background:var(--accent);border-color:var(--accent)}.btn-primary:hover{background:var(--accent2)}
    .grid{display:grid;gap:14px}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{text-align:center;padding:50px 12px 34px}.hero h1{font-size:clamp(2.2rem,8vw,4.5rem);line-height:1.05;margin:0 0 14px}.hero p{max-width:650px;margin:0 auto;color:var(--muted);font-size:1.05rem}
    .feature{padding:22px}.feature h2{font-size:1.05rem;margin:0 0 7px}.feature p{margin:0;color:var(--muted);font-size:.94rem}.icon{font-size:1.35rem;margin-bottom:10px}
    footer{border-top:1px solid var(--line);padding:24px 0 34px;text-align:center;color:var(--muted);font-size:.9rem}.brand-link{color:var(--text);font-weight:700;text-decoration:none}
    table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left}th{font-size:.85rem;color:var(--muted)}input,select{width:100%;background:#0e1219;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 11px;outline:0}input:focus,select:focus{border-color:var(--accent)}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{margin-top:18px}.stat{padding:18px}.stat b{display:block;font-size:1.8rem;margin-top:4px}.bar{height:7px;background:#202633;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
    .player{width:100%;display:block;background:#000;border-radius:12px;max-height:75vh}.player-box{padding:8px}.meta{padding:20px}.player-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.notice{padding:11px;border:1px solid var(--line);border-radius:9px;background:#0f141d;color:var(--muted);font-size:.9rem}
    @media(max-width:760px){.grid-3{grid-template-columns:1fr}.wrap{width:min(100% - 20px,1040px)}main{padding-top:22px}.hero{padding-top:30px}.hero h1{font-size:2.5rem}th,td{padding:9px 7px;font-size:.86rem}.hide-mobile{display:none}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a class="brand" href="/"><span class="brand-mark">A</span>Anizoneflix</a>
      <a class="btn" href="https://t.me/anizoneflix" rel="noopener">@anizoneflix</a>
    </nav>
    <main>{% block content %}{% endblock %}</main>
    <footer>
      <a class="brand-link" href="https://t.me/anizoneflix" rel="noopener">Anizoneflix</a>
      <div>https://t.me/anizoneflix</div>
    </footer>
  </div>
</body>
</html>
