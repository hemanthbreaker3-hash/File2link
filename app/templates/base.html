<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HiTLER YT Official{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --neon-blue: #00d4ff;
            --dark-blue: #0a1628;
            --deeper-blue: #050d1a;
            --accent-red: #ff2d55;
            --soft-red: #ff4d6d;
            --glass-bg: rgba(10, 22, 40, 0.65);
            --glass-border: rgba(0, 212, 255, 0.15);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            color: #e2e8f0;
            font-family: 'Outfit', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: var(--deeper-blue);
        }

        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.35) saturate(0.8);
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at top, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at bottom right, rgba(255, 45, 85, 0.06) 0%, transparent 40%),
                        linear-gradient(180deg, rgba(5, 13, 26, 0.7) 0%, rgba(5, 13, 26, 0.92) 100%);
            z-index: -1;
        }

        .watermark {
            position: fixed;
            bottom: 20px;
            right: 20px;
            opacity: 0.08;
            font-size: 1.5rem;
            font-weight: 800;
            pointer-events: none;
            z-index: 1000;
            user-select: none;
            text-transform: uppercase;
            letter-spacing: 0.15rem;
            transform: rotate(-12deg);
            color: var(--neon-blue);
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .glass-card {
            background: rgba(10, 22, 40, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 255, 0.12);
            border-radius: 1.25rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(0, 212, 255, 0.28);
            box-shadow: 0 12px 40px rgba(0, 212, 255, 0.08);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #00b4d8 0%, #0077b6 50%, #023e8a 100%);
            color: white;
            transition: all 0.25s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.3);
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.4);
        }

        .btn-red {
            background: linear-gradient(135deg, #ff2d55 0%, #c9184a 100%);
            color: white;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(255, 45, 85, 0.3);
        }

        .btn-red:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 45, 85, 0.4);
        }

        .text-neon {
            color: var(--neon-blue);
            text-shadow: 0 0 12px rgba(0, 212, 255, 0.5);
        }

        .text-gradient {
            background: linear-gradient(135deg, #00d4ff 0%, #48cae4 40%, #ff2d55 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-link {
            position: relative;
            transition: color 0.2s;
        }
        .nav-link:hover {
            color: var(--neon-blue);
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--neon-blue);
            transition: width 0.25s ease;
        }
        .nav-link:hover::after {
            width: 100%;
        }

        /* Smooth scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 22, 40, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 212, 255, 0.5);
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: fadeInUp 0.45s ease forwards;
        }

        @keyframes pulse-neon {
            0%, 100% { box-shadow: 0 0 8px rgba(0, 212, 255, 0.3); }
            50% { box-shadow: 0 0 18px rgba(0, 212, 255, 0.55); }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="p-3 sm:p-5 md:p-8">
    <video autoplay muted loop playsinline id="bg-video" poster="/static/images/poster.jpg">
        <source src="/static/cantarella-smiles-at-you-wuthering-waves-moewalls-com.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>
    <div class="watermark">HiTLER YT</div>

    <nav class="max-w-6xl mx-auto flex justify-between items-center mb-8 sm:mb-10 glass p-3 sm:p-4 rounded-2xl animate-in">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl overflow-hidden border border-cyan-500/40 shadow-[0_0_12px_rgba(0,212,255,0.35)] flex-shrink-0">
                <img src="/static/images/logo.jpg" alt="Logo" class="w-full h-full object-cover">
            </div>
            <span class="text-xl sm:text-2xl font-bold tracking-tight">
                <span class="text-white">HiTLER</span><span class="text-neon"> YT</span>
            </span>
        </div>
        <div class="hidden md:flex space-x-7 text-sm font-medium">
            <a href="/" class="nav-link">Home</a>
            <a href="https://t.me/cantarellabots" target="_blank" rel="noopener" class="nav-link">Channel</a>
            <a href="https://t.me/cantarella_wuwa" target="_blank" rel="noopener" class="nav-link">Developer</a>
        </div>
        <a href="https://t.me/cantarellabots" target="_blank" rel="noopener" class="btn-gradient px-4 sm:px-6 py-2 rounded-xl font-semibold text-sm">
            Join Channel
        </a>
    </nav>

    <main class="max-w-6xl mx-auto">
        {% block content %}{% endblock %}
    </main>

    <footer class="mt-16 sm:mt-20 py-10 border-t border-cyan-500/10 text-center">
        <div class="mb-5">
            <h2 class="text-xl font-bold mb-1"><span class="text-white">HiTLER</span> <span class="text-neon">YT Official</span></h2>
            <p class="text-slate-500 text-sm">High-performance media streaming</p>
        </div>
        <div class="flex justify-center gap-6 mb-6 text-sm">
            <a href="https://t.me/cantarellabots" target="_blank" rel="noopener" class="text-slate-400 hover:text-cyan-400 transition flex items-center gap-2">
                <i class="fab fa-telegram"></i> Channel
            </a>
            <a href="https://t.me/cantarella_wuwa" target="_blank" rel="noopener" class="text-slate-400 hover:text-cyan-400 transition flex items-center gap-2">
                <i class="fas fa-code"></i> Developer
            </a>
        </div>
        <p class="text-slate-600 text-xs">&copy; 2024–2026 HiTLER YT Official. All rights reserved.</p>
    </footer>
</body>
</html>
