<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="description" content="ANIZONEFLIX direct media streaming">
  <title>{% block title %}ANIZONEFLIX{% endblock %}</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0b0f;--card:#15151b;--line:#282832;--text:#f5f5f7;--muted:#a5a5b0;--accent:#ff2f6d}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:inherit;text-decoration:none}button,input,select{font:inherit}.wrap{width:min(100% - 24px,980px);margin:auto}
    .topbar{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,11,15,.96);z-index:20}
    .brand{font-weight:800;letter-spacing:.3px}.brand span{color:var(--accent)}.brand-link{color:#ddd;font-size:13px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px}.muted{color:var(--muted)}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#1c1c24;color:#fff;cursor:pointer}
    .btn:hover{border-color:#454554}.accent{background:var(--accent);border-color:var(--accent)}
    main{padding:28px 0 90px}.footer{text-align:center;color:#777;font-size:12px;padding:28px 0 80px;border-top:1px solid var(--line)}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
    @media(max-width:600px){main{padding-top:20px}.wrap{width:min(100% - 16px,980px)}}
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<header class="topbar"><div class="wrap" style="display:flex;justify-content:space-between;align-items:center">
  <a class="brand" href="/">ANIZONE<span>FLIX</span></a>
  <a class="brand-link" href="https://t.me/anizoneflix" target="_blank" rel="noopener">@anizoneflix</a>
</div></header>
<main><div class="wrap">{% block content %}{% endblock %}</div></main>
<footer class="footer"><a href="https://t.me/anizoneflix" target="_blank" rel="noopener">ANIZONEFLIX · @anizoneflix</a></footer>
</body>
</html>
